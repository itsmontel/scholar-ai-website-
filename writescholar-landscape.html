<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#292524" />
  <title>WriteScholar — writescholar.com</title>
  <style>
    @page {
      size: landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c0a09;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* Matches site footer: bg-stone-800 dark:bg-stone-950, border-t stone-700 */
    .frame {
      width: min(96vw, 1200px);
      aspect-ratio: 16 / 9;
      max-height: min(92vh, 675px);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3rem) clamp(2rem, 6vw, 4rem);
      background: #292524;
      border: 1px solid #44403c;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    /* Footer.tsx: flex items-center space-x-2.5 — mascot + wordmark */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
    }

    .brand:hover .wordmark {
      opacity: 0.95;
    }

    .brand .mascot {
      flex-shrink: 0;
      width: clamp(36px, 7vw, 72px);
      height: clamp(36px, 7vw, 72px);
      object-fit: contain;
      display: block;
    }

    /* text-xl font-extrabold tracking-tight text-white */
    .brand .wordmark {
      font-size: clamp(1.25rem, 3.2vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1;
      color: #fff;
    }

    .brand:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 6px;
      border-radius: 12px;
    }

    @media (max-width: 640px), (orientation: portrait) {
      .frame {
        flex-direction: column;
        aspect-ratio: auto;
        max-height: none;
        width: min(94vw, 520px);
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="frame" role="main">
    <a class="brand" href="https://writescholar.com/" rel="noopener noreferrer" aria-label="WriteScholar.com">
      <img
        class="mascot"
        src="public/mascot.png"
        alt=""
        width="72"
        height="72"
        decoding="async"
      />
      <span class="wordmark">WriteScholar.com</span>
    </a>
  </main>
</body>
</html>
