<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WriteScholar – Mascot Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Crimson+Text:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F5F0;
      padding: 0;
      margin: 0;
      position: relative;
    }
    .bg-blobs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      top: -100px;
      right: -80px;
    }
    .blob-2 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #7C3AED 0%, #6d28d9 100%);
      bottom: -60px;
      left: -60px;
    }
    .blob-3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #a78bfa 0%, #8B5CF6 100%);
      top: 40%;
      left: 15%;
    }
    .blob-4 {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6366f1 100%);
      bottom: 25%;
      right: 20%;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo-mascot {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }
    .logo-mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .logo-text {
      font-family: 'Nunito', -apple-system, sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: #1c1917;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="hero-content">
    <div class="logo">
      <div class="logo-mascot">
        <img src="../mascot.png" alt="">
      </div>
      <span class="logo-text">WriteScholar</span>
    </div>
  </div>
</body>
</html>
