<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 1: Choose Sites to Block</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Crimson+Text:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F5F0;
      padding: 0;
      margin: 0;
      position: relative;
    }
    .bg-blobs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      top: -100px;
      right: -80px;
    }
    .blob-2 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #7C3AED 0%, #6d28d9 100%);
      bottom: -60px;
      left: -60px;
    }
    .blob-3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #a78bfa 0%, #8B5CF6 100%);
      top: 40%;
      left: 15%;
    }
    .blob-4 {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6366f1 100%);
      bottom: 25%;
      right: 20%;
    }
    .container {
      position: relative;
      z-index: 2;
      width: 1280px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 56px;
    }
    .text-section {
      flex: 0 1 360px;
      max-width: 360px;
    }
    .heading {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .highlight {
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .body-text {
      font-size: 14px;
      line-height: 1.5;
      color: #57534e;
    }
    .body-text p { margin-bottom: 8px; }
    .body-text p:last-child { margin-bottom: 0; }
    .card-section {
      flex-shrink: 0;
    }
    .mockup-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(139, 92, 246, 0.1);
      transform: rotate(2deg);
      width: 280px;
      border: 1px solid #e7e5e4;
    }
    .mockup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .mockup-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .mockup-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .mockup-title {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: #1c1917;
    }
    .sites-label {
      font-size: 11px;
      font-weight: 700;
      color: #292524;
      margin-bottom: 10px;
    }
    .sites-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .site-tag {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      background: #8B5CF6;
      color: white;
    }
    .site-tag.inactive {
      background: #f5f5f4;
      color: #57534e;
      border: 1px solid #e7e5e4;
    }
    .add-row {
      display: flex;
      gap: 8px;
    }
    .add-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #e7e5e4;
      border-radius: 10px;
      font-size: 12px;
      font-family: inherit;
      color: #292524;
    }
    .add-row input::placeholder { color: #a8a29e; }
    .add-row button {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="container">
    <div class="text-section">
      <h1 class="heading">
        <span class="highlight">Choose</span> sites to block
      </h1>
      <div class="body-text">
        <p>When you want to stay focused, add distracting sites to your block list. Choose from presets or add any custom domain.</p>
        <p>Free: 3 sites. Pro: 20. Premium: unlimited.</p>
      </div>
    </div>
    <div class="card-section">
      <div class="mockup-card">
        <div class="mockup-header">
          <div class="mockup-logo"><img src="../mascot.png" alt="WriteScholar"></div>
          <span class="mockup-title">Focus Mode</span>
        </div>
        <div class="sites-label">Sites to block</div>
        <div class="sites-grid">
          <span class="site-tag">youtube.com</span>
          <span class="site-tag">instagram.com</span>
          <span class="site-tag">reddit.com</span>
          <span class="site-tag inactive">netflix.com</span>
          <span class="site-tag inactive">tiktok.com</span>
        </div>
        <div class="add-row">
          <input type="text" placeholder="Add custom domain..." value="">
          <button>Add</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
