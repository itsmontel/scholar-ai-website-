<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 5: Unlock Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Crimson+Text:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F5F0;
      padding: 0;
      margin: 0;
      position: relative;
    }
    .bg-blobs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      top: -100px;
      right: -80px;
    }
    .blob-2 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #7C3AED 0%, #6d28d9 100%);
      bottom: -60px;
      left: -60px;
    }
    .blob-3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #a78bfa 0%, #8B5CF6 100%);
      top: 40%;
      left: 15%;
    }
    .blob-4 {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6366f1 100%);
      bottom: 25%;
      right: 20%;
    }
    .container {
      position: relative;
      z-index: 2;
      width: 1280px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 56px;
    }
    .text-section {
      flex: 0 1 400px;
      max-width: 400px;
    }
    .heading {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .highlight {
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .body-text {
      font-size: 14px;
      line-height: 1.5;
      color: #57534e;
      max-width: 320px;
    }
    .body-text p { margin-bottom: 8px; }
    .body-text p:last-child { margin-bottom: 0; }
    .card-section {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 0;
      position: relative;
    }
    .mockup-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(139, 92, 246, 0.1);
      transform: rotate(1.5deg);
      width: 300px;
      border: 1px solid #e7e5e4;
      text-align: center;
    }
    .unlock-mascot {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .unlock-mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .access-message {
      font-size: 18px;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 6px;
    }
    .access-sub {
      font-size: 12px;
      color: #78716c;
      margin-bottom: 18px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: default;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      border: none;
    }
    .btn-secondary {
      background: white;
      color: #44403c;
      border: 1px solid #e7e5e4;
    }
    .youtube-overlay {
      width: 320px;
      max-height: 360px;
      object-fit: contain;
      object-position: bottom;
      border-radius: 16px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(139, 92, 246, 0.1);
      border: 1px solid #e7e5e4;
      margin-left: -60px;
      margin-bottom: -15px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="container">
    <div class="text-section">
      <h1 class="heading">
        <span class="highlight">Unlock</span> & enjoy
      </h1>
      <div class="body-text">
        <p>Your earned time starts now. The site stays unlocked for the duration you chose, 5 min to 24 hours.</p>
        <p>When time's up, the block returns automatically. No refresh needed. Earn more screen time anytime.</p>
      </div>
    </div>
    <div class="card-section">
      <div class="mockup-card">
        <div class="unlock-mascot"><img src="../mascot.png" alt="WriteScholar"></div>
        <div class="access-message">Access granted ✓</div>
        <div class="access-sub">30 min remaining</div>
        <div class="btn-row">
          <button class="btn btn-primary">Continue to site</button>
          <button class="btn btn-secondary">Go back</button>
        </div>
      </div>
      <img src="Youtubeunlocked.png" alt="YouTube unlocked" class="youtube-overlay">
    </div>
  </div>
</body>
</html>
