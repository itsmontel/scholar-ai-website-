<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup: Feature Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Crimson+Text:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F5F0;
      padding: 0;
      margin: 0;
      position: relative;
    }
    .bg-blobs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      top: -100px;
      right: -80px;
    }
    .blob-2 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #7C3AED 0%, #6d28d9 100%);
      bottom: -60px;
      left: -60px;
    }
    .blob-3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #a78bfa 0%, #8B5CF6 100%);
      top: 40%;
      left: 15%;
    }
    .blob-4 {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6366f1 100%);
      bottom: 25%;
      right: 20%;
    }
    .bg-features {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 48px 64px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 32px;
      opacity: 0.15;
    }
    .feature-tile {
      background: white;
      border-radius: 16px;
      border: 1px solid #e7e5e4;
      padding: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #57534e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .feature-tile .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      margin-bottom: 10px;
    }
    .fg-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }
    .hero-card {
      background: white;
      border-radius: 24px;
      padding: 48px 56px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.08), 0 4px 16px rgba(139, 92, 246, 0.1);
      border: 1px solid #e7e5e4;
      text-align: center;
    }
    .hero-title {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 12px;
    }
    .hero-title span {
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      padding: 2px 10px;
      border-radius: 4px;
    }
    .hero-sub {
      font-size: 16px;
      color: #57534e;
      line-height: 1.5;
      max-width: 420px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="bg-features">
    <div class="feature-tile"><div class="icon"></div>Block any site</div>
    <div class="feature-tile"><div class="icon"></div>Solve puzzle</div>
    <div class="feature-tile"><div class="icon"></div>Study quiz</div>
    <div class="feature-tile"><div class="icon"></div>Custom timer</div>
    <div class="feature-tile"><div class="icon"></div>Sudoku</div>
    <div class="feature-tile"><div class="icon"></div>Memory</div>
    <div class="feature-tile"><div class="icon"></div>Pattern</div>
    <div class="feature-tile"><div class="icon"></div>Earn screen time</div>
    <div class="feature-tile"><div class="icon"></div>Notes sync</div>
    <div class="feature-tile"><div class="icon"></div>5 min–24 hr</div>
    <div class="feature-tile"><div class="icon"></div>Pass threshold</div>
    <div class="feature-tile"><div class="icon"></div>Focus Mode</div>
  </div>
  <div class="fg-content">
    <div class="hero-card">
      <h1 class="hero-title">WriteScholar <span>Focus Mode</span></h1>
      <p class="hero-sub">Block sites until you study. Solve a puzzle or pass a quiz to unlock. No scroll until you've earned it.</p>
    </div>
  </div>
</body>
</html>
