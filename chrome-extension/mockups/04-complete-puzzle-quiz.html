<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 4: Complete Puzzle / Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Crimson+Text:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F5F0;
      padding: 0;
      margin: 0;
      position: relative;
    }
    .bg-blobs {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
    }
    .blob-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      top: -100px;
      right: -80px;
    }
    .blob-2 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #7C3AED 0%, #6d28d9 100%);
      bottom: -60px;
      left: -60px;
    }
    .blob-3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #a78bfa 0%, #8B5CF6 100%);
      top: 40%;
      left: 15%;
    }
    .blob-4 {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6366f1 100%);
      bottom: 25%;
      right: 20%;
    }
    .container {
      position: relative;
      z-index: 2;
      width: 1280px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 56px;
    }
    .text-section {
      flex: 0 1 380px;
      max-width: 380px;
    }
    .heading {
      font-family: 'Crimson Text', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .highlight {
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .body-text {
      font-size: 14px;
      line-height: 1.5;
      color: #57534e;
    }
    .body-text p { margin-bottom: 8px; }
    .body-text p:last-child { margin-bottom: 0; }
    .card-section {
      flex-shrink: 0;
      display: flex;
      gap: 20px;
      align-items: stretch;
    }
    .mockup-card {
      background: white;
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.08), 0 4px 12px rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.15);
      text-align: center;
      flex: 1;
      min-width: 0;
      max-width: 280px;
    }
    .mockup-card:nth-child(1) { transform: rotate(-1.5deg); }
    .mockup-card:nth-child(2) { transform: rotate(1.5deg); }
    .pass-type {
      font-size: 9px;
      font-weight: 700;
      color: #8B5CF6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .success-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .success-mascot {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .success-mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .success-check {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .results-title {
      font-size: 16px;
      font-weight: 800;
      color: #1c1917;
      margin-bottom: 4px;
    }
    .results-score {
      font-size: 13px;
      font-weight: 600;
      color: #6d28d9;
      margin-bottom: 14px;
    }
    .unlock-btn {
      width: 100%;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: white;
      cursor: default;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="container">
    <div class="text-section">
      <h1 class="heading">
        Complete <span class="highlight">quiz</span> or puzzle
      </h1>
      <div class="body-text">
        <p>Get enough answers right to pass. Set your pass threshold and choose how many questions. Puzzles: solve Sudoku or Memory to unlock.</p>
        <p>Pass the bar and unlock for the duration you chose.</p>
      </div>
    </div>
    <div class="card-section">
      <div class="mockup-card">
        <div class="pass-type">Study quiz</div>
        <div class="success-badge">
          <div class="success-mascot"><img src="../mascot.png" alt="WriteScholar"></div>
          <div class="success-check">✓</div>
        </div>
        <div class="results-title">Quiz passed!</div>
        <div class="results-score">8 of 10 correct</div>
        <button class="unlock-btn">Unlock for 30 min</button>
      </div>
      <div class="mockup-card">
        <div class="pass-type">Puzzle</div>
        <div class="success-badge">
          <div class="success-mascot"><img src="../mascot.png" alt="WriteScholar"></div>
          <div class="success-check">✓</div>
        </div>
        <div class="results-title">Puzzle solved!</div>
        <div class="results-score">Sudoku complete</div>
        <button class="unlock-btn">Unlock for 30 min</button>
      </div>
    </div>
  </div>
</body>
</html>
