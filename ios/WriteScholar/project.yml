# XcodeGen config for WriteScholar iOS app.
# Regenerate the .xcodeproj after editing this file:
#   $ cd ios/WriteScholar && xcodegen generate && open WriteScholar.xcodeproj

name: WriteScholar
options:
  bundleIdPrefix: com.writescholar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""        # ← fill in your Apple Developer team ID
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  WriteScholar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WriteScholar
        excludes:
          - "Info.plist"
    resources:
      - WriteScholar/Resources
      - WriteScholar/Assets.xcassets
    info:
      path: WriteScholar/Info.plist
      properties:
        CFBundleDisplayName: WriteScholar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
        # Allow plain HTTP to localhost (and 127.0.0.1) so Debug builds can
        # reach the dev backend on the host Mac. Production talks to
        # https://writescholar.com and is not affected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UIAppFonts:
          - "EBGaramond-Regular.ttf"
          - "EBGaramond-Bold.ttf"
          - "Nunito-Regular.ttf"
          - "Nunito-SemiBold.ttf"
          - "Nunito-Bold.ttf"
        # Light-status-bar so the violet hero looks right on launch
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.writescholar.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: WriteScholar/WriteScholar.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Focus mode (iOS Family Controls / Screen Time API).
        # Requires Apple to approve the entitlement request for this
        # bundle ID before real shielding works at runtime — UI is
        # safe to ship beforehand.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.writescholar.focus
