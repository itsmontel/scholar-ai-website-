<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WriteScholar Flyer — Free AI Essay Grader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <style>
    @page { size: letter; margin: 0; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: #f5f5f4; }
    .flyer {
      width: 816px;
      height: 1056px;
      margin: 24px auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      background: #FFF4E0;
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }
    @media print {
      body { background: white; }
      .flyer { margin: 0; box-shadow: none; }
    }

    /* Header */
    .header {
      position: absolute;
      top: 28px;
      left: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: white;
      padding: 6px;
      border: 2px solid #FFE3B0;
      box-shadow: 0 3px 0 #F0CC8A;
      object-fit: contain;
    }
    .header .brand {
      font-weight: 900;
      font-size: 22px;
      color: #3C3C3C;
    }
    .header .promo-pill {
      margin-left: auto;
      background: #58CC02;
      color: white;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 7px 16px;
      border-radius: 999px;
      border-bottom: 3px solid #46A302;
      text-transform: uppercase;
    }

    /* "FREE" hero treatment */
    .free-banner {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .free-banner .label {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.4em;
      color: #FF9600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .free-banner .free-text {
      font-weight: 900;
      font-size: 180px;
      line-height: 0.85;
      color: #FF4B4B;
      letter-spacing: -0.05em;
      text-shadow: 0 6px 0 rgba(0,0,0,0.06);
      margin: 0;
    }
    .free-banner .underline {
      width: 320px;
      height: 6px;
      background: #FF9600;
      border-radius: 3px;
      margin: 14px auto 0;
    }

    /* Subtitle */
    .subtitle {
      position: absolute;
      top: 372px;
      left: 60px;
      right: 60px;
      text-align: center;
    }
    .subtitle h1 {
      font-weight: 900;
      font-size: 38px;
      line-height: 1.05;
      color: #3C3C3C;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .subtitle p {
      font-size: 16px;
      font-weight: 700;
      color: #6B6B6B;
      margin: 10px 0 0;
      line-height: 1.4;
    }

    /* Real screenshot */
    .screenshot {
      position: absolute;
      top: 510px;
      left: 60px;
      right: 60px;
      background: white;
      border: 3px solid #FF9600;
      border-bottom: 7px solid #D97F00;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 12px 28px -10px rgba(255,150,0,0.3);
    }
    .screenshot img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }
    .screenshot .badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #3C3C3C;
      color: white;
      font-weight: 900;
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 999px;
      border: 2px solid white;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    /* Mascot peek bottom-right of subtitle */
    .mascot-peek {
      position: absolute;
      top: 410px;
      right: 24px;
      width: 78px;
      height: auto;
      transform: rotate(10deg);
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    }

    /* CTA */
    .cta {
      position: absolute;
      bottom: 40px;
      left: 60px;
      right: 60px;
      background: #3C3C3C;
      border-radius: 22px;
      border-bottom: 8px solid #1A1A1A;
      padding: 22px 28px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      color: white;
    }
    .cta h2 {
      font-weight: 900;
      font-size: 26px;
      margin: 0 0 4px 0;
      letter-spacing: -0.02em;
    }
    .cta .sub {
      font-size: 14px;
      opacity: 0.85;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .cta .url {
      display: inline-block;
      background: #FF9600;
      color: white;
      font-weight: 900;
      font-size: 15px;
      padding: 8px 18px;
      border-radius: 12px;
      border-bottom: 3px solid #D97F00;
    }
    .cta .qr {
      background: white;
      border-radius: 14px;
      padding: 8px;
    }
    .cta .qr img { width: 96px; height: 96px; display: block; }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="header">
      <img src="https://writescholar.com/main-logo.png" alt="WriteScholar" class="logo-img" />
      <div class="brand">WriteScholar</div>
      <div class="promo-pill">No Sign-Up · No Credit Card</div>
    </div>

    <div class="free-banner">
      <div class="label">★ ★ ★  GET STARTED  ★ ★ ★</div>
      <h1 class="free-text">FREE</h1>
      <div class="underline"></div>
    </div>

    <div class="subtitle">
      <h1>AI Essay Grader</h1>
      <p>Paste your essay. Get a grade, rubric scores, and<br/>line-by-line feedback in 30 seconds.</p>
    </div>

    <!-- Real mascot peeking from the side -->
    <img src="https://writescholar.com/mascot-cta.png" alt="" class="mascot-peek" />

    <!-- Real screenshot of the full grade report from the live product -->
    <div class="screenshot">
      <span class="badge">Actual product output</span>
      <img src="https://writescholar.com/full-report.png" alt="WriteScholar AI essay grading report with letter grade, rubric breakdown, and revision suggestions" />
    </div>

    <div class="cta">
      <div>
        <h2>writescholar.com</h2>
        <div class="sub">Free forever. No credit card needed.</div>
        <span class="url">FREE — TRY IT NOW</span>
      </div>
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=svg&data=https%3A%2F%2Fwritescholar.com%2Ftools%2Fanalyze%3Futm_source%3Dflyer%26utm_medium%3Dprint%26utm_campaign%3Dfree_grader" alt="QR code" />
      </div>
    </div>
  </div>
</body>
</html>
