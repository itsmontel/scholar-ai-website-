<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Word Tower study game preview</title>
  <desc id="desc">Tower of stacked blocks catching falling answer chips</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="55%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="220" rx="16" fill="url(#bg)"/>
  <rect x="16" y="16" width="328" height="188" rx="12" stroke="#e7e5e4" stroke-width="1.25" fill="#fff7ff" fill-opacity=".65"/>
  <text x="32" y="44" fill="#581c87" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Word Tower</text>
  <!-- Falling tiles -->
  <rect x="88" y="58" rx="8" ry="8" width="62" height="28" fill="#fcd34d" stroke="#ca8a04" stroke-width="1"/>
  <rect x="200" y="42" rx="8" ry="8" width="72" height="28" fill="#86efac" stroke="#15803d" stroke-width="1"/>
  <!-- Tower -->
  <g transform="translate(156 168)">
    <rect x="0" y="0" width="48" height="18" rx="4" fill="url(#tower)"/>
    <rect x="-6" y="-20" width="60" height="18" rx="4" fill="url(#tower)" opacity=".92"/>
    <rect x="-2" y="-40" width="52" height="18" rx="4" fill="url(#tower)" opacity=".85"/>
    <rect x="-8" y="-60" width="64" height="18" rx="4" fill="url(#tower)" opacity=".78"/>
    <path d="M-14 34h76v8H-14z" fill="#78716c" opacity=".85" rx="2"/>
    <rect x="-18" y="34" width="84" height="10" rx="3" fill="#44403c" opacity=".5"/>
  </g>
</svg>
