[build]
  command = "npm run build"
  publish = "dist"

# Canonical domain: redirect www to non-www so writescholar.com and www.writescholar.com
# don't exist as separate pages (301 permanent redirect)
[[redirects]]
  from = "https://www.writescholar.com/*"
  to = "https://writescholar.com/:splat"
  status = 301
  force = true

# SPA fallback - serve index.html for all routes, let React handle routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
