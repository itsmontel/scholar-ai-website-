# NOTE: Do not add "trailing slash removal" redirects like from = "/features/" to = "/features".
# Netlify was matching paths *without* a trailing slash and issuing 301 to the same URL,
# causing ERR_TOO_MANY_REDIRECTS. Canonical URLs are handled in the SPA (src/utils/seo.ts).

# SPA fallback - serve index.html for all routes, let React handle routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# Demo MP4s in /public — cache at the edge so repeat visits do not re-download large files
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
